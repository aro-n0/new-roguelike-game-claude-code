<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON DECAY // Cyber Survivor</title>
<style>
:root{
  --neon-cyan:#00fff2; --neon-magenta:#ff00e5; --neon-yellow:#f4ff00;
  --neon-green:#39ff88; --neon-red:#ff2b4d; --neon-purple:#a600ff;
  --bg-deep:#04050a; --panel-bg:rgba(8,10,20,0.9);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:'Consolas','Courier New',monospace;color:var(--neon-cyan);user-select:none;}
#app{position:relative;width:100vw;height:100vh;}
canvas{position:absolute;top:0;left:0;display:block;background:radial-gradient(ellipse at center,#0a0c18 0%,#030308 100%);}
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,255,242,0.035) 0px,rgba(0,255,242,0.035) 1px,transparent 2px,transparent 3px);animation:scanmove 8s linear infinite;mix-blend-mode:screen;}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:49;box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.85);}
@keyframes scanmove{0%{background-position-y:0px;}100%{background-position-y:200px;}}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(20,10,40,0.55),rgba(2,2,6,0.97));gap:18px;overflow-y:auto;padding:20px 0;}
.hidden{display:none!important;}
.glitch-title{font-size:56px;font-weight:900;letter-spacing:6px;color:var(--neon-cyan);text-shadow:0 0 6px var(--neon-cyan),0 0 22px var(--neon-cyan),2px 0 var(--neon-magenta),-2px 0 var(--neon-green);animation:glitchTitle 3.2s infinite;text-align:center;}
.sub-title{color:var(--neon-magenta);letter-spacing:8px;font-size:13px;text-shadow:0 0 8px var(--neon-magenta);}
@keyframes glitchTitle{0%,89%,100%{transform:translate(0,0) skew(0deg);}90%{transform:translate(-3px,1px) skew(2deg);}91%{transform:translate(3px,-1px) skew(-2deg);}92%{transform:translate(-2px,0);}93%{transform:translate(0,0);}}
.menu-tabs{display:flex;gap:14px;}
.neon-btn{background:transparent;border:2px solid var(--neon-cyan);color:var(--neon-cyan);padding:12px 30px;font-size:15px;letter-spacing:2px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:6px;text-shadow:0 0 6px var(--neon-cyan);box-shadow:0 0 10px rgba(0,255,242,0.35),inset 0 0 10px rgba(0,255,242,0.1);transition:all .15s ease;}
.neon-btn:hover{background:rgba(0,255,242,0.12);box-shadow:0 0 22px var(--neon-cyan),inset 0 0 18px rgba(0,255,242,0.25);transform:translateY(-2px);}
.neon-btn.magenta{border-color:var(--neon-magenta);color:var(--neon-magenta);text-shadow:0 0 6px var(--neon-magenta);box-shadow:0 0 10px rgba(255,0,229,0.35);}
.neon-btn.magenta:hover{background:rgba(255,0,229,0.12);box-shadow:0 0 22px var(--neon-magenta);}
.neon-btn.yellow{border-color:var(--neon-yellow);color:var(--neon-yellow);text-shadow:0 0 6px var(--neon-yellow);box-shadow:0 0 10px rgba(244,255,0,0.35);}
.neon-btn.yellow:hover{background:rgba(244,255,0,0.12);box-shadow:0 0 22px var(--neon-yellow);}
.neon-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none;}
.neon-btn.small{padding:6px 14px;font-size:11px;}

/* Global currency HUD - always top-right, compact, high-contrast */
.global-currency-bar{position:fixed;top:12px;right:14px;z-index:90;display:flex;gap:8px;pointer-events:none;}
.curr-pill{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(20,8,30,0.95),rgba(5,5,12,0.95));border:1.5px solid var(--neon-yellow);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:bold;color:var(--neon-yellow);text-shadow:0 0 6px var(--neon-yellow);box-shadow:0 0 12px rgba(244,255,0,0.5),inset 0 0 8px rgba(244,255,0,0.08);}
.curr-pill.star{border-color:#d1c4ff;color:#efe9ff;text-shadow:0 0 6px #d1c4ff;box-shadow:0 0 12px rgba(209,196,255,0.55),inset 0 0 8px rgba(209,196,255,0.1);}
.star-icon-svg{width:13px;height:17px;filter:drop-shadow(0 0 3px #d1c4ff);}
.global-currency-bar.dim{opacity:0.55;}

#hud{position:absolute;top:0;left:0;right:0;z-index:22;pointer-events:none;padding:14px 18px;}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;}
.hp-bar-outer{width:260px;height:20px;border:2px solid var(--neon-red);border-radius:10px;overflow:hidden;box-shadow:0 0 10px rgba(255,43,77,0.5);background:rgba(0,0,0,0.5);}
.hp-bar-inner{height:100%;background:linear-gradient(90deg,#ff2b4d,#ff7a90);transition:width .15s;box-shadow:0 0 12px var(--neon-red);}
.hud-stat{background:var(--panel-bg);border:1px solid var(--neon-cyan);border-radius:8px;padding:6px 12px;font-size:12px;margin-left:8px;text-shadow:0 0 5px var(--neon-cyan);}
.wave-banner{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:var(--neon-magenta);text-shadow:0 0 20px var(--neon-magenta);opacity:0;z-index:30;pointer-events:none;letter-spacing:6px;font-weight:900;text-align:center;}
.wave-banner.show{animation:waveBanner 1.8s ease-out;}
.star-banner{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#e8def8;text-shadow:0 0 16px #d1c4ff;opacity:0;z-index:30;pointer-events:none;letter-spacing:2px;font-weight:900;}
.star-banner.show{animation:waveBanner 2.2s ease-out;}
@keyframes waveBanner{0%{opacity:0;transform:translate(-50%,-50%) scale(0.6);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}30%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;}}
.stats-panel{background:var(--panel-bg);border:2px solid var(--neon-magenta);border-radius:14px;padding:28px 44px;box-shadow:0 0 30px rgba(255,0,229,0.4);display:flex;flex-direction:column;gap:8px;min-width:320px;}
.stats-panel h2{color:var(--neon-red);text-shadow:0 0 10px var(--neon-red);letter-spacing:4px;margin-bottom:8px;text-align:center;}
.stat-line{display:flex;justify-content:space-between;font-size:14px;color:var(--neon-cyan);border-bottom:1px dashed rgba(0,255,242,0.25);padding:4px 0;}
.stat-line span:last-child{color:var(--neon-yellow);text-shadow:0 0 6px var(--neon-yellow);}

#skilltreeScreen{justify-content:flex-start;padding-top:14px;}
.slot-bar{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;justify-content:center;}
.slot-btn{background:rgba(10,12,24,0.85);border:2px solid #2a3550;color:#7d8cb0;border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;}
.slot-btn.active{border-color:var(--neon-yellow);color:var(--neon-yellow);box-shadow:0 0 10px rgba(244,255,0,0.4);}
.gate-note{font-size:11px;color:var(--neon-magenta);text-shadow:0 0 6px var(--neon-magenta);margin-bottom:4px;text-align:center;max-width:90vw;}
.tree-hint{font-size:10px;color:#5a6a90;margin-bottom:4px;letter-spacing:1px;}

/* Scrollable skill tree viewport */
#skillCanvasWrap{
  position:relative;
  width:min(1200px,96vw); height:min(600px,60vh);
  border:1px solid rgba(0,255,242,0.3); border-radius:12px;
  background:rgba(5,6,14,0.7);
  overflow:auto;
}
#skillCanvasWrap::-webkit-scrollbar{width:10px;height:10px;}
#skillCanvasWrap::-webkit-scrollbar-track{background:rgba(0,0,0,0.4);}
#skillCanvasWrap::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-cyan),var(--neon-magenta));border-radius:6px;}
#skillTreeInner{
  position:relative;
  width:2000px; height:1500px;
  background-image:radial-gradient(circle at 50% 50%, rgba(0,255,242,0.05) 0%, transparent 60%),
    repeating-linear-gradient(0deg, rgba(0,255,242,0.03) 0px, rgba(0,255,242,0.03) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(0,255,242,0.03) 0px, rgba(0,255,242,0.03) 1px, transparent 1px, transparent 40px);
}
.skill-node{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px solid #2a3550;background:rgba(10,12,24,0.94);cursor:pointer;text-align:center;font-size:9px;line-height:1.15;color:#5a6a90;transition:all .15s;transform:translate(-50%,-50%);}
.skill-node .icon{font-size:18px;}
.skill-node.core{width:60px;height:60px;border-color:#fff;color:#fff;background:radial-gradient(circle,#1a2540,#05060c);box-shadow:0 0 24px rgba(255,255,255,0.45);cursor:default;font-size:9px;z-index:5;}
.skill-node.token-avail{border-color:var(--neon-yellow);color:var(--neon-yellow);box-shadow:0 0 12px rgba(244,255,0,0.4);}
.skill-node.token-avail:hover{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 24px var(--neon-yellow);z-index:10;}
.skill-node.build-avail{border-color:#d1c4ff;color:#e8def8;box-shadow:0 0 12px rgba(209,196,255,0.5);}
.skill-node.build-avail:hover{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 24px #d1c4ff;z-index:10;}
.skill-node.owned-token{border-color:var(--neon-green);color:var(--neon-green);background:rgba(57,255,136,0.14);}
.skill-node.owned-build{border-color:var(--neon-magenta);color:#ffd1f0;background:rgba(255,0,229,0.16);}
.skill-node.locked{opacity:0.35;cursor:default;}
.skill-node.hidden-node{opacity:0.5;cursor:default;}
.skill-node.capstone{width:80px;height:80px;}
.skill-node.ultimate{width:88px;height:88px;border-width:3px;}
.branch-label{position:absolute;font-size:11px;letter-spacing:2px;font-weight:bold;text-shadow:0 0 8px currentColor;transform:translate(-50%,-50%);pointer-events:none;opacity:0.85;}
#skillLines{position:absolute;inset:0;pointer-events:none;}
.footer-bar{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.tooltip{position:absolute;z-index:200;background:var(--panel-bg);border:1px solid var(--neon-cyan);border-radius:8px;padding:10px 14px;font-size:12px;max-width:230px;color:#cfeff5;pointer-events:none;box-shadow:0 0 14px rgba(0,255,242,0.3);}
.settings-row{display:flex;flex-direction:column;gap:14px;align-items:center;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div class="global-currency-bar" id="globalCurrency"></div>

  <div id="titleScreen" class="screen">
    <div class="glitch-title">NEON DECAY</div>
    <div class="sub-title">// CYBER SURVIVOR PROTOCOL //</div>
    <div class="menu-tabs">
      <button class="neon-btn" id="btnStart">ゲーム開始</button>
      <button class="neon-btn magenta" id="btnSkillTree">スキルツリー</button>
      <button class="neon-btn yellow" id="btnSettings">設定</button>
    </div>
    <div style="font-size:11px;color:#7d8cb0;">最高到達WAVE: <span id="titleMaxWave">0</span></div>
  </div>

  <div id="settingsScreen" class="screen hidden">
    <div class="glitch-title" style="font-size:32px;">SETTINGS</div>
    <div class="settings-row">
      <label style="color:var(--neon-cyan);">BGM音量: <input type="range" id="bgmVol" min="0" max="100" value="35"></label>
      <label style="color:var(--neon-cyan);">SE音量: <input type="range" id="seVol" min="0" max="100" value="70"></label>
    </div>
    <button class="neon-btn" id="btnSettingsBack">戻る</button>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div>
        <div class="hp-bar-outer"><div class="hp-bar-inner" id="hpBar" style="width:100%"></div></div>
        <div style="font-size:11px;margin-top:4px;color:var(--neon-cyan);">HP <span id="hpText">100/100</span></div>
      </div>
      <div style="display:flex;">
        <div class="hud-stat">WAVE <span id="waveText" style="color:var(--neon-magenta);">1</span></div>
        <div class="hud-stat">KILL <span id="killText" style="color:var(--neon-green);">0</span></div>
        <div class="hud-stat">⬡ <span id="runTokenText" style="color:var(--neon-yellow);">0</span></div>
        <div class="hud-stat">TIME <span id="timeText">00:00</span></div>
      </div>
    </div>
  </div>
  <div class="wave-banner" id="waveBanner"></div>
  <div class="star-banner" id="starBanner"></div>

  <div id="gameOverScreen" class="screen hidden">
    <div class="stats-panel">
      <h2>&gt;&gt; SYSTEM FAILURE &lt;&lt;</h2>
      <div class="stat-line"><span>到達WAVE</span><span id="statWave">1</span></div>
      <div class="stat-line"><span>撃破数</span><span id="statKills">0</span></div>
      <div class="stat-line"><span>生存時間</span><span id="statTime">00:00</span></div>
      <div class="stat-line"><span>獲得トークン</span><span id="statTokens">0</span></div>
      <div class="stat-line"><span>獲得スキルスター</span><span id="statStars">0</span></div>
    </div>
    <button class="neon-btn magenta" id="btnNext">次へ ▶</button>
  </div>

  <div id="skilltreeScreen" class="screen hidden">
    <div class="sub-title" style="margin-bottom:2px;">SKILL MATRIX</div>
    <div class="slot-bar" id="slotBar"></div>
    <div class="gate-note" id="gateNote"></div>
    <div class="tree-hint">※ ドラッグ／スクロールでツリーを移動できます</div>
    <div id="skillCanvasWrap">
      <div id="skillTreeInner">
        <svg id="skillLines" width="2000" height="1500"></svg>
      </div>
    </div>
    <div class="footer-bar">
      <button class="neon-btn yellow small" id="btnRespec">スキルスター振り直し（トークン消費）</button>
      <button class="neon-btn" id="btnTreeExit">終了</button>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1f0"/>
      <stop offset="50%" stop-color="#d1c4ff"/>
      <stop offset="100%" stop-color="#c4f5ff"/>
    </linearGradient>
  </defs>
</svg>

<script>
(function(){
"use strict";

/* =========================================================
   0. SAVE / LOAD
   ========================================================= */
const SAVE_KEY='neonDecaySaveV2';
function defaultSave(){
  return {
    tokens:0, skillStars:0, maxWave:0,
    tokenLevels:{},
    slots:[
      {name:'スロット1', build:{}},{name:'スロット2', build:{}},
      {name:'スロット3', build:{}},{name:'スロット4', build:{}},
      {name:'スロット5', build:{}},
    ],
    activeSlot:0,
    milestonesClaimed:[],
    settings:{bgm:0.35, se:0.7}
  };
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultSave();
    const p = JSON.parse(raw);
    const d = defaultSave();
    return {
      tokens: p.tokens||0, skillStars: p.skillStars||0, maxWave:p.maxWave||0,
      tokenLevels: p.tokenLevels||{},
      slots: (p.slots && p.slots.length===5)? p.slots : d.slots,
      activeSlot: p.activeSlot||0,
      milestonesClaimed: p.milestonesClaimed||[],
      settings: Object.assign({bgm:0.35,se:0.7}, p.settings||{})
    };
  }catch(e){ return defaultSave(); }
}
let gameData = loadGame();
function saveGame(){ localStorage.setItem(SAVE_KEY, JSON.stringify(gameData)); }
let audioVolumes = { bgm:gameData.settings.bgm, se:gameData.settings.se };

/* =========================================================
   1. AUDIO ENGINE
   ========================================================= */
const AudioEngine=(function(){
  let ctx=null,master=null,bgmGain=null,seGain=null,bgmNodes=[];
  function init(){
    if(ctx) return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.connect(ctx.destination);
    bgmGain=ctx.createGain(); bgmGain.gain.value=audioVolumes.bgm; bgmGain.connect(master);
    seGain=ctx.createGain(); seGain.gain.value=audioVolumes.se; seGain.connect(master);
  }
  function setVol(bgm,se){ audioVolumes.bgm=bgm; audioVolumes.se=se; if(bgmGain) bgmGain.gain.value=bgm; if(seGain) seGain.gain.value=se; }
  function playTone({freq=440,dur=0.15,type='sine',gain=0.3,slideTo=null,delay=0}){
    if(!ctx) return;
    const t0=ctx.currentTime+delay;
    const osc=ctx.createOscillator(); const g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(seGain);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst({dur=0.2,gain=0.25,delay=0,filterFreq=1200}){
    if(!ctx) return;
    const t0=ctx.currentTime+delay;
    const bufferSize=ctx.sampleRate*dur;
    const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*(1-i/bufferSize); }
    const src=ctx.createBufferSource(); src.buffer=buffer;
    const filter=ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=filterFreq;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    src.connect(filter); filter.connect(g); g.connect(seGain);
    src.start(t0);
  }
  const SE={
    attack(){ playTone({freq:220,slideTo:120,dur:0.09,type:'square',gain:0.18}); },
    hitEnemy(){ noiseBurst({dur:0.08,gain:0.3,filterFreq:1800}); },
    enemyDie(){ playTone({freq:520,slideTo:60,dur:0.28,type:'sawtooth',gain:0.22}); noiseBurst({dur:0.15,gain:0.15,filterFreq:900,delay:0.02}); },
    playerHit(){ playTone({freq:140,slideTo:50,dur:0.32,type:'triangle',gain:0.35}); noiseBurst({dur:0.25,gain:0.2,filterFreq:400}); },
    token(){ playTone({freq:880,slideTo:1400,dur:0.12,type:'sine',gain:0.25}); },
    chest(){ playTone({freq:440,slideTo:1200,dur:0.4,type:'sine',gain:0.3}); playTone({freq:660,slideTo:1600,dur:0.4,type:'sine',gain:0.22,delay:0.06}); },
    skillBuy(){ playTone({freq:300,slideTo:900,dur:0.18,type:'square',gain:0.2}); },
    starGain(){ playTone({freq:660,slideTo:1320,dur:0.3,type:'sine',gain:0.28}); playTone({freq:990,slideTo:1980,dur:0.35,type:'sine',gain:0.2,delay:0.08}); },
    waveStart(){ playTone({freq:110,slideTo:220,dur:0.5,type:'sawtooth',gain:0.25}); },
    gameOver(){ playTone({freq:300,slideTo:40,dur:1.1,type:'sawtooth',gain:0.3}); },
    click(){ playTone({freq:600,dur:0.05,type:'square',gain:0.15}); },
    laser(){ playTone({freq:1400,slideTo:300,dur:0.22,type:'sawtooth',gain:0.16}); },
    lightning(){ noiseBurst({dur:0.12,gain:0.28,filterFreq:2600}); playTone({freq:1800,slideTo:400,dur:0.1,type:'square',gain:0.12}); },
    fireball(){ noiseBurst({dur:0.3,gain:0.3,filterFreq:300}); playTone({freq:100,slideTo:40,dur:0.4,type:'sawtooth',gain:0.2}); },
    poison(){ playTone({freq:300,slideTo:260,dur:0.15,type:'sine',gain:0.08}); }
  };
  function startBGM(){
    if(!ctx) return; stopBGM();
    const baseFreqs=[55,110,165];
    baseFreqs.forEach((f,i)=>{
      const osc=ctx.createOscillator(); osc.type=i===2?'square':'sawtooth'; osc.frequency.value=f;
      const g=ctx.createGain(); g.gain.value=i===0?0.18:(i===1?0.09:0.04);
      const filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=500;
      const lfo=ctx.createOscillator(); lfo.frequency.value=0.07+i*0.02;
      const lfoGain=ctx.createGain(); lfoGain.gain.value=180;
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
      osc.connect(filter); filter.connect(g); g.connect(bgmGain);
      osc.start(); lfo.start(); bgmNodes.push(osc,lfo);
    });
    const notes=[220,262,330,392,330,262]; let idx=0;
    const arp=setInterval(()=>{ if(!ctx){clearInterval(arp);return;} playTone({freq:notes[idx%notes.length],dur:0.35,type:'triangle',gain:0.05}); idx++; },600);
    bgmNodes.push({stop:()=>clearInterval(arp)});
  }
  function stopBGM(){ bgmNodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} }); bgmNodes=[]; }
  return {init,SE,startBGM,stopBGM,setVol,get ctx(){return ctx;}};
})();

/* =========================================================
   2. CANVAS
   ========================================================= */
const canvas=document.getElementById('game');
const ctx2d=canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }

function roundRectPath(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function norm(v){ const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l]; }
function drawRoundedPolygon(cx,cy,radius,sides,rotation,cornerRadius){
  const points=[];
  for(let i=0;i<sides;i++){ const ang=rotation+i*(Math.PI*2/sides); points.push([cx+Math.cos(ang)*radius, cy+Math.sin(ang)*radius]); }
  ctx2d.beginPath();
  for(let i=0;i<points.length;i++){
    const p0=points[i], p1=points[(i+1)%points.length], p2=points[(i+2)%points.length];
    const v1=norm([p0[0]-p1[0],p0[1]-p1[1]]), v2=norm([p2[0]-p1[0],p2[1]-p1[1]]);
    const cut=Math.min(cornerRadius,radius*0.5);
    const start=[p1[0]+v1[0]*cut,p1[1]+v1[1]*cut], end=[p1[0]+v2[0]*cut,p1[1]+v2[1]*cut];
    if(i===0) ctx2d.moveTo(start[0],start[1]); else ctx2d.lineTo(start[0],start[1]);
    ctx2d.quadraticCurveTo(p1[0],p1[1],end[0],end[1]);
  }
  ctx2d.closePath();
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

const ALL_NODES=[...TOKEN_NODES, ...BUILD_NODES];
function findNode(id){ return ALL_NODES.find(n=>n.id===id); }

function getLevel(node){
  if(node.category==='token') return gameData.tokenLevels[node.id]||0;
  const slot=gameData.slots[gameData.activeSlot];
  return (slot.build && slot.build[node.id])||0;
}
function isRevealed(node){
  if(node.category==='token') return true;
  if(node.tier==='root') return tokenTotalLevels()>=GATE_THRESHOLD;
  if(node.tier==='mid') return getLevel(findNode(node.req.id))>=node.req.lvl;
  if(node.tier==='capstone'){
    const a=findNode(node.req.id), c=findNode(node.req.id2);
    return getLevel(a)>=node.req.lvl && getLevel(c)>=node.req.lvl2;
  }
  if(node.tier==='ultimate'){
    return getLevel(findNode(node.req.id))>=node.req.lvl;
  }
  return false;
}
function canAfford(node){
  const lvl=getLevel(node);
  if(lvl>=node.maxLv) return false;
  const cost=costAt(node,lvl);
  return node.category==='token'? gameData.tokens>=cost : gameData.skillStars>=cost;
}
function buyNode(node){
  const lvl=getLevel(node);
  if(lvl>=node.maxLv) return;
  if(!isRevealed(node)) return;
  if(node.category==='token' && node.req && getLevel(findNode(node.req.id))<node.req.lvl) return;
  const cost=costAt(node,lvl);
  if(node.category==='token'){
    if(gameData.tokens<cost) return;
    gameData.tokens-=cost; gameData.tokenLevels[node.id]=lvl+1;
  }else{
    if(gameData.skillStars<cost) return;
    gameData.skillStars-=cost;
    const slot=gameData.slots[gameData.activeSlot];
    if(!slot.build) slot.build={};
    slot.build[node.id]=lvl+1;
  }
  AudioEngine.SE.skillBuy();
  saveGame();
  renderSkillTree();
}

function computePlayerStats(){
  const base={maxHp:100,damage:1,range:70,atkSpd:1.0,speed:180,regen:0,magnet:40,crit:0.05};
  const build={statusChance:0,statusDmgMult:1,poisonDmg:0,frostSlow:0,
    laserUnlocked:false,laserDmg:0,laserDmgMult:1,laserWidth:20,
    bowUnlocked:false,arrowCount:1,arrowDmg:0,bowDmgMult:1,
    boxerMode:false,boxerDmg:0,boxerCombo:1,boxerDmgMult:1,
    mageUnlocked:false,chainCount:0,mageDmg:0,mageDmgMult:1,fireballRadius:0,fireballDmg:0};
  TOKEN_NODES.forEach(n=>{ const l=gameData.tokenLevels[n.id]||0; if(l>0) n.apply(base,l); });
  const slot=gameData.slots[gameData.activeSlot];
  BUILD_NODES.forEach(n=>{ const l=(slot.build&&slot.build[n.id])||0; if(l>0) n.apply(build,l,base); });
  return {base,build};
}

function spawnEnemy(wave){
  const roll=Math.random();
  const edge=Math.floor(Math.random()*4); let x,y; const margin=60;
  if(edge===0){x=-margin;y=Math.random()*H;} else if(edge===1){x=W+margin;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=-margin;} else {x=Math.random()*W;y=H+margin;}
  const diff=1+(wave-1)*0.18;
  let type; if(roll<0.55) type='square'; else if(roll<0.82) type='triangle'; else type='pentagon';
  const b={
    square:{hp:14,dmg:8,spd:70,r:16,color:'#ff3860',shape:'square'},
    triangle:{hp:10,dmg:6,spd:55,r:14,color:'#ffbe0b',shape:'triangle',ranged:true,shootRange:260,shootCd:1.8},
    pentagon:{hp:44,dmg:16,spd:32,r:24,color:'#a600ff',shape:'pentagon',tank:true},
  }[type];
  return {x,y,type,shape:b.shape,color:b.color,r:b.r,hp:Math.round(b.hp*diff),maxHp:Math.round(b.hp*diff),
    dmg:Math.round(b.dmg*(1+(wave-1)*0.12)),spd:b.spd*(1+Math.min(0.6,(wave-1)*0.04)),
    ranged:!!b.ranged,tank:!!b.tank,shootRange:b.shootRange||0,shootCd:b.shootCd||0,shootTimer:Math.random()*1.5,
    hitFlash:0,dots:[],slowFactor:1,slowTimer:0};
}

let lastTime=0;
function startRun(){
  W=canvas.width; H=canvas.height;
  game={player:makePlayer(),enemies:[],bullets:[],particles:[],chests:[],swings:[],lightnings:[],fireballs:[],
    wave:1,waveTimer:0,waveDuration:26,spawnTimer:0,kills:0,elapsed:0,shake:0,running:true,tokensThisRun:0,starsThisRun:0};
  game.player.x=W/2; game.player.y=H/2;
  showScreen('game'); showWaveBanner(1); AudioEngine.SE.waveStart();
  lastTime=performance.now(); requestAnimationFrame(loop);
}
function showWaveBanner(w){ const el=document.getElementById('waveBanner'); el.textContent='WAVE '+w; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function showStarBanner(){ const el=document.getElementById('starBanner'); el.textContent='🌟 スキルスター獲得！'; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

function loop(now){
  if(!game||!game.running) return;
  let dt=(now-lastTime)/1000; lastTime=now; dt=Math.min(dt,0.05);
  update(dt); render();
  requestAnimationFrame(loop);
}

function update(dt){
  const p=game.player;
  game.elapsed+=dt; game.waveTimer+=dt; game.spawnTimer+=dt;
  if(p.invuln>0) p.invuln-=dt;
  if(game.shake>0) game.shake=Math.max(0,game.shake-dt*40);

  if(game.waveTimer>=game.waveDuration){
    const clearedWave=game.wave;
    game.waveTimer=0; game.wave++;
    game.waveDuration=Math.max(14,26-game.wave*0.4);
    showWaveBanner(game.wave); AudioEngine.SE.waveStart();
    if(clearedWave%10===0 && !gameData.milestonesClaimed.includes(clearedWave)){
      gameData.milestonesClaimed.push(clearedWave);
      gameData.skillStars+=1; game.starsThisRun+=1;
      saveGame(); AudioEngine.SE.starGain(); showStarBanner();
    }
  }

  const spawnInterval=Math.max(0.35,1.3-game.wave*0.05);
  const maxEnemies=Math.min(60,10+game.wave*3);
  if(game.spawnTimer>=spawnInterval && game.enemies.length<maxEnemies){
    game.spawnTimer=0; game.enemies.push(spawnEnemy(game.wave));
  }

  let mvx=0,mvy=0;
  if(keys['w']||keys['arrowup']) mvy-=1;
  if(keys['s']||keys['arrowdown']) mvy+=1;
  if(keys['a']||keys['arrowleft']) mvx-=1;
  if(keys['d']||keys['arrowright']) mvx+=1;
  const len=Math.hypot(mvx,mvy)||1;
  p.x+=(mvx/len)*p.base.speed*dt; p.y+=(mvy/len)*p.base.speed*dt;
  p.x=Math.max(p.r,Math.min(W-p.r,p.x)); p.y=Math.max(p.r,Math.min(H-p.r,p.y));

  const nearestEnemy=()=> game.enemies.length? game.enemies.reduce((a,b)=>dist(a.x,a.y,p.x,p.y)<dist(b.x,b.y,p.x,p.y)?a:b) : null;

  p.atkTimer-=dt;
  if(p.atkTimer<=0){
    const targets=game.enemies.filter(e=>dist(e.x,e.y,p.x,p.y)<=p.base.range+e.r);
    if(targets.length>0){
      p.atkTimer=1/p.base.atkSpd;
      const nearest=targets.reduce((a,b)=>dist(a.x,a.y,p.x,p.y)<dist(b.x,b.y,p.x,p.y)?a:b);
      p.swingAngle=Math.atan2(nearest.y-p.y,nearest.x-p.x);
      AudioEngine.SE.attack();
      let dmg;
      if(p.build.boxerMode){
        dmg=(p.base.damage+p.build.boxerDmg)*p.build.boxerDmgMult*p.build.boxerCombo;
      } else {
        dmg=p.base.damage;
      }
      targets.forEach(e=>{
        const isCrit=Math.random()<p.base.crit;
        damageEnemy(e, dmg*(isCrit?2:1));
        tryApplyStatus(e);
      });
      game.swings.push({x:p.x,y:p.y,angle:p.swingAngle,life:0.18,maxLife:0.18,range:p.base.range,boxer:p.build.boxerMode});
    }
  }

  if(!p.build.boxerMode){
    if(p.build.bowUnlocked){
      p.boltTimer-=dt;
      if(p.boltTimer<=0 && game.enemies.length>0){
        p.boltTimer=1.0/p.base.atkSpd;
        const sorted=[...game.enemies].sort((a,b)=>dist(a.x,a.y,p.x,p.y)-dist(b.x,b.y,p.x,p.y));
        const n=Math.min(p.build.arrowCount, Math.max(1,sorted.length));
        for(let i=0;i<n;i++){
          const target=sorted[i%sorted.length];
          const ang=Math.atan2(target.y-p.y,target.x-p.x)+(i-((n-1)/2))*0.08;
          game.bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,r:5,
            dmg:p.build.arrowDmg*p.build.bowDmgMult,owner:'player',pierce:false,hitSet:new Set(),color:'#f4ff00'});
        }
        AudioEngine.SE.attack();
      }
    }
    if(p.build.laserUnlocked){
      p.laserTimer-=dt;
      if(p.laserTimer<=0){
        const target=nearestEnemy();
        if(target){
          p.laserTimer=1.4/p.base.atkSpd;
          const angReal=Math.atan2(target.y-p.y,target.x-p.x);
          const ex=p.x+Math.cos(angReal)*p.base.range*2, ey=p.y+Math.sin(angReal)*p.base.range*2;
          game.lightnings.push({type:'laser',x1:p.x,y1:p.y,x2:ex,y2:ey,life:0.22,maxLife:0.22});
          AudioEngine.SE.laser();
          const dmg=p.build.laserDmg*p.build.laserDmgMult;
          game.enemies.forEach(e=>{
            const d=pointToSegDist(e.x,e.y,p.x,p.y,ex,ey);
            if(d<p.build.laserWidth/2+e.r){ damageEnemy(e,dmg); tryApplyStatus(e); }
          });
        }
      }
    }
    if(p.build.mageUnlocked){
      p.mageTimer-=dt;
      if(p.mageTimer<=0 && game.enemies.length>0){
        p.mageTimer=1.2/p.base.atkSpd;
        AudioEngine.SE.lightning();
        let current=nearestEnemy();
        const hit=new Set(); let chainDmg=p.build.mageDmg*p.build.mageDmgMult;
        let prevX=p.x, prevY=p.y;
        for(let i=0;i<=p.build.chainCount && current;i++){
          damageEnemy(current, chainDmg); tryApplyStatus(current);
          game.lightnings.push({type:'bolt',x1:prevX,y1:prevY,x2:current.x,y2:current.y,life:0.18,maxLife:0.18});
          hit.add(current); prevX=current.x; prevY=current.y; chainDmg*=0.8;
          const next=game.enemies.filter(e=>!hit.has(e) && dist(e.x,e.y,current.x,current.y)<160)
            .sort((a,b)=>dist(a.x,a.y,current.x,current.y)-dist(b.x,b.y,current.x,current.y))[0];
          current=next;
        }
      }
      if(p.build.fireballRadius>0){
        p.fireballTimer-=dt;
        if(p.fireballTimer<=0 && game.enemies.length>0){
          p.fireballTimer=2.4/p.base.atkSpd;
          const target=nearestEnemy();
          if(target){
            AudioEngine.SE.fireball();
            game.fireballs.push({x:target.x,y:target.y,r:0,maxR:p.build.fireballRadius,life:0.4,maxLife:0.4});
            const dmg=p.build.fireballDmg*p.build.mageDmgMult;
            game.enemies.forEach(e=>{ if(dist(e.x,e.y,target.x,target.y)<p.build.fireballRadius){ damageEnemy(e,dmg); tryApplyStatus(e); } });
          }
        }
      }
    }
  }

  game.swings.forEach(s=>s.life-=dt); game.swings=game.swings.filter(s=>s.life>0);
  game.lightnings.forEach(l=>l.life-=dt); game.lightnings=game.lightnings.filter(l=>l.life>0);
  game.fireballs.forEach(f=>{ f.life-=dt; f.r=f.maxR*(1-f.life/f.maxLife); }); game.fireballs=game.fireballs.filter(f=>f.life>0);

  for(const e of game.enemies){
    if(e.hitFlash>0) e.hitFlash-=dt;
    if(e.slowTimer>0){ e.slowTimer-=dt; if(e.slowTimer<=0) e.slowFactor=1; }
    if(e.dots.length){
      for(const d of e.dots){
        d.tickTimer-=dt;
        if(d.tickTimer<=0){ d.tickTimer=d.interval; damageEnemy(e,d.dmg); AudioEngine.SE.poison(); spawnParticles(e.x,e.y,d.color,3); }
        d.remaining-=dt;
      }
      e.dots=e.dots.filter(d=>d.remaining>0);
    }
    const effSpd=e.spd*e.slowFactor;
    const d=dist(e.x,e.y,p.x,p.y);
    if(e.ranged){
      if(d>e.shootRange*0.7){ moveToward(e,p,dt,effSpd); } else if(d<e.shootRange*0.45){ moveAway(e,p,dt,effSpd); }
      e.shootTimer-=dt;
      if(e.shootTimer<=0 && d<e.shootRange){
        e.shootTimer=e.shootCd;
        const ang=Math.atan2(p.y-e.y,p.x-e.x);
        game.bullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*220,vy:Math.sin(ang)*220,r:6,dmg:e.dmg,owner:'enemy',color:'#ffbe0b'});
      }
    } else {
      moveToward(e,p,dt,effSpd);
      if(d<e.r+p.r) hitPlayer(e.dmg);
    }
  }

  for(const b of game.bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.dead=(b.x<-50||b.x>W+50||b.y<-50||b.y>H+50);
    if(b.owner==='enemy' && !b.dead){
      if(dist(b.x,b.y,p.x,p.y)<b.r+p.r){ hitPlayer(b.dmg); b.dead=true; }
    } else if(b.owner==='player' && !b.dead){
      for(const e of game.enemies){
        if(b.hitSet.has(e)) continue;
        if(dist(b.x,b.y,e.x,e.y)<b.r+e.r){ damageEnemy(e,b.dmg); tryApplyStatus(e); b.hitSet.add(e); if(!b.pierce){ b.dead=true; break; } }
      }
    }
  }
  game.bullets=game.bullets.filter(b=>!b.dead);

  for(const pt of game.particles){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.92; pt.vy*=0.92; pt.life-=dt; }
  game.particles=game.particles.filter(pt=>pt.life>0);

  for(const c of game.chests){
    c.phase+=dt*3;
    if(dist(c.x,c.y,p.x,p.y)<c.r+p.r+10){ c.collected=true; game.tokensThisRun+=c.value; AudioEngine.SE.chest(); spawnParticles(c.x,c.y,'#f4ff00',18); }
  }
  game.chests=game.chests.filter(c=>!c.collected);

  if(p.base.regen>0 && p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+p.base.regen*dt);
  game.enemies=game.enemies.filter(e=>!e.dead);
  updateHUD();
  if(p.hp<=0) endRun();
}

function tryApplyStatus(e){
  const p=game.player; const chance=p.build.statusChance;
  if(chance<=0) return;
  if(Math.random()>=chance) return;
  if(p.build.poisonDmg>0){
    e.dots.push({color:'#39ff88',dmg:p.build.poisonDmg*p.build.statusDmgMult,interval:0.5,tickTimer:0.5,remaining:3});
  }
  if(p.build.frostSlow>0){
    e.slowFactor=Math.max(0.15,1-p.build.frostSlow); e.slowTimer=2;
  }
}
function moveToward(e,p,dt,spd){ const ang=Math.atan2(p.y-e.y,p.x-e.x); e.x+=Math.cos(ang)*spd*dt; e.y+=Math.sin(ang)*spd*dt; }
function moveAway(e,p,dt,spd){ const ang=Math.atan2(e.y-p.y,e.x-p.x); e.x+=Math.cos(ang)*spd*dt; e.y+=Math.sin(ang)*spd*dt; }
function pointToSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1; const len2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/len2; t=Math.max(0,Math.min(1,t));
  const cx=x1+t*dx, cy=y1+t*dy; return dist(px,py,cx,cy);
}
function damageEnemy(e,amount){
  e.hp-=amount; e.hitFlash=0.12; AudioEngine.SE.hitEnemy(); spawnParticles(e.x,e.y,e.color,4);
  if(e.hp<=0 && !e.dead){ e.dead=true; game.kills++; AudioEngine.SE.enemyDie(); spawnParticles(e.x,e.y,e.color,16); spawnChestMaybe(e.x,e.y); }
}
function hitPlayer(amount){
  const p=game.player; if(p.invuln>0) return;
  p.hp-=amount; p.invuln=0.5; AudioEngine.SE.playerHit(); screenShake(10); spawnParticles(p.x,p.y,'#ff2b4d',10);
}
function updateHUD(){
  const p=game.player;
  document.getElementById('hpBar').style.width=Math.max(0,(p.hp/p.maxHp*100))+'%';
  document.getElementById('hpText').textContent=Math.max(0,Math.ceil(p.hp))+'/'+p.maxHp;
  document.getElementById('waveText').textContent=game.wave;
  document.getElementById('killText').textContent=game.kills;
  document.getElementById('runTokenText').textContent=game.tokensThisRun;
  const mm=String(Math.floor(game.elapsed/60)).padStart(2,'0'), ss=String(Math.floor(game.elapsed%60)).padStart(2,'0');
  document.getElementById('timeText').textContent=mm+':'+ss;
}
function endRun(){
  game.running=false; AudioEngine.SE.gameOver();
  const tokensEarned=Math.round(game.wave*15+game.kills*1+game.tokensThisRun);
  gameData.tokens+=tokensEarned; gameData.maxWave=Math.max(gameData.maxWave,game.wave); saveGame();
  document.getElementById('statWave').textContent=game.wave;
  document.getElementById('statKills').textContent=game.kills;
  const mm=String(Math.floor(game.elapsed/60)).padStart(2,'0'), ss=String(Math.floor(game.elapsed%60)).padStart(2,'0');
  document.getElementById('statTime').textContent=mm+':'+ss;
  document.getElementById('statTokens').textContent=tokensEarned;
  document.getElementById('statStars').textContent=game.starsThisRun;
  setTimeout(()=>showScreen('gameover'),500);
}

/* =========================================================
   6. RENDER
   ========================================================= */
function render(){
  ctx2d.save(); ctx2d.clearRect(0,0,W,H); drawGrid();
  let shakeX=0,shakeY=0;
  if(game.shake>0){ shakeX=(Math.random()-0.5)*game.shake; shakeY=(Math.random()-0.5)*game.shake; ctx2d.translate(shakeX,shakeY); }

  for(const c of game.chests){
    const glow=10+Math.sin(c.phase)*6;
    ctx2d.save(); ctx2d.shadowColor='#f4ff00'; ctx2d.shadowBlur=glow; ctx2d.fillStyle='#f4ff00';
    roundRectPath(ctx2d,c.x-c.r,c.y-c.r,c.r*2,c.r*2,5); ctx2d.fill();
    ctx2d.strokeStyle='#fff'; ctx2d.lineWidth=2; ctx2d.stroke(); ctx2d.restore();
  }
  for(const pt of game.particles){ ctx2d.globalAlpha=Math.max(0,pt.life/pt.maxLife); ctx2d.fillStyle=pt.color; ctx2d.beginPath(); ctx2d.arc(pt.x,pt.y,pt.size,0,Math.PI*2); ctx2d.fill(); }
  ctx2d.globalAlpha=1;
  for(const e of game.enemies) drawEnemy(e);
  for(const b of game.bullets){ ctx2d.save(); ctx2d.shadowColor=b.color; ctx2d.shadowBlur=14; ctx2d.fillStyle=b.color; ctx2d.beginPath(); ctx2d.arc(b.x,b.y,b.r,0,Math.PI*2); ctx2d.fill(); ctx2d.restore(); }

  for(const l of game.lightnings){
    const a=l.life/l.maxLife;
    ctx2d.save(); ctx2d.globalAlpha=a; ctx2d.strokeStyle=l.type==='laser'?'#00fff2':'#d1c4ff';
    ctx2d.lineWidth=l.type==='laser'?5:3; ctx2d.shadowColor=ctx2d.strokeStyle; ctx2d.shadowBlur=16;
    ctx2d.beginPath(); ctx2d.moveTo(l.x1,l.y1); ctx2d.lineTo(l.x2,l.y2); ctx2d.stroke(); ctx2d.restore();
  }
  for(const f of game.fireballs){
    const a=f.life/f.maxLife;
    ctx2d.save(); ctx2d.globalAlpha=a*0.5; ctx2d.fillStyle='#ff6a2b'; ctx2d.shadowColor='#ff6a2b'; ctx2d.shadowBlur=24;
    ctx2d.beginPath(); ctx2d.arc(f.x,f.y,f.r,0,Math.PI*2); ctx2d.fill(); ctx2d.restore();
  }
  for(const s of game.swings){
    const a=s.life/s.maxLife;
    ctx2d.save(); ctx2d.globalAlpha=a*0.6; ctx2d.strokeStyle=s.boxer?'#ff2b4d':'#00fff2'; ctx2d.lineWidth=6;
    ctx2d.shadowColor=ctx2d.strokeStyle; ctx2d.shadowBlur=18;
    ctx2d.beginPath(); ctx2d.arc(s.x,s.y,s.range*0.7,s.angle-0.9,s.angle+0.9); ctx2d.stroke(); ctx2d.restore();
  }
  drawPlayer(game.player);
  ctx2d.restore();
}
function drawGrid(){
  ctx2d.save(); ctx2d.strokeStyle='rgba(0,255,242,0.06)'; ctx2d.lineWidth=1; const size=48;
  for(let x=0;x<W;x+=size){ ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,H); ctx2d.stroke(); }
  for(let y=0;y<H;y+=size){ ctx2d.beginPath(); ctx2d.moveTo(0,y); ctx2d.lineTo(W,y); ctx2d.stroke(); }
  ctx2d.restore();
}
function drawPlayer(p){
  ctx2d.save();
  if(p.invuln>0 && Math.floor(p.invuln*20)%2===0) ctx2d.globalAlpha=0.4;
  ctx2d.shadowColor=p.build.boxerMode?'#ff2b4d':'#00fff2'; ctx2d.shadowBlur=20;
  ctx2d.fillStyle='#0a1830'; ctx2d.strokeStyle=p.build.boxerMode?'#ff2b4d':'#00fff2'; ctx2d.lineWidth=3;
  ctx2d.beginPath(); ctx2d.arc(p.x,p.y,p.r,0,Math.PI*2); ctx2d.fill(); ctx2d.stroke();
  ctx2d.fillStyle='#f4ff00'; ctx2d.shadowColor='#f4ff00'; ctx2d.shadowBlur=10;
  ctx2d.beginPath(); const cy=p.y-p.r-2;
  ctx2d.moveTo(p.x-12,cy); ctx2d.lineTo(p.x-12,cy-10); ctx2d.lineTo(p.x-6,cy-2); ctx2d.lineTo(p.x,cy-14);
  ctx2d.lineTo(p.x+6,cy-2); ctx2d.lineTo(p.x+12,cy-10); ctx2d.lineTo(p.x+12,cy); ctx2d.closePath(); ctx2d.fill();
  if(!p.build.boxerMode){
    ctx2d.strokeStyle='#c98a4b'; ctx2d.lineWidth=5; ctx2d.shadowBlur=0;
    ctx2d.beginPath(); ctx2d.moveTo(p.x,p.y); ctx2d.lineTo(p.x+Math.cos(p.swingAngle)*(p.r+14), p.y+Math.sin(p.swingAngle)*(p.r+14)); ctx2d.stroke();
  } else {
    ctx2d.fillStyle='#ff2b4d'; ctx2d.shadowBlur=0;
    ctx2d.beginPath(); ctx2d.arc(p.x+Math.cos(p.swingAngle)*(p.r+8), p.y+Math.sin(p.swingAngle)*(p.r+8), 7,0,Math.PI*2); ctx2d.fill();
  }
  ctx2d.restore();
}
function drawEnemy(e){
  ctx2d.save();
  const flashColor=e.hitFlash>0?'#ffffff':(e.dots.some(d=>d.color==='#39ff88')?'#7cffb0':e.color);
  ctx2d.shadowColor=e.color; ctx2d.shadowBlur=14; ctx2d.fillStyle=flashColor; ctx2d.strokeStyle=e.color; ctx2d.lineWidth=2;
  if(e.shape==='square'){ roundRectPath(ctx2d,e.x-e.r,e.y-e.r,e.r*2,e.r*2,6); ctx2d.fill(); ctx2d.stroke(); }
  else if(e.shape==='triangle'){ drawRoundedPolygon(e.x,e.y,e.r,3,-Math.PI/2,4); ctx2d.fill(); ctx2d.stroke(); }
  else if(e.shape==='pentagon'){ drawRoundedPolygon(e.x,e.y,e.r,5,-Math.PI/2,5); ctx2d.fill(); ctx2d.stroke(); }
  if(e.slowFactor<1){ ctx2d.strokeStyle='#8fd6ff'; ctx2d.lineWidth=2; ctx2d.beginPath(); ctx2d.arc(e.x,e.y,e.r+4,0,Math.PI*2); ctx2d.stroke(); }
  ctx2d.restore();
  const w=e.r*2;
  ctx2d.save(); ctx2d.translate(e.x-w/2,e.y-e.r-10);
  ctx2d.fillStyle='rgba(0,0,0,0.6)'; ctx2d.fillRect(0,0,w,4);
  ctx2d.fillStyle=e.color; ctx2d.fillRect(0,0,w*Math.max(0,e.hp/e.maxHp),4);
  ctx2d.restore();
}

function starIconHtml(){ return `<svg class="star-icon-svg" viewBox="0 0 100 140"><path d="M50 2 C54 2 56 6 58 14 L66 46 C82 48 96 50 98 54 C100 58 96 62 84 70 L64 84 C68 100 72 116 70 122 C68 128 62 128 50 118 C38 128 32 128 30 122 C28 116 32 100 36 84 L16 70 C4 62 0 58 2 54 C4 50 18 48 34 46 L42 14 C44 6 46 2 50 2 Z" fill="url(#starGrad)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`; }
function renderGlobalCurrency(){
  document.getElementById('globalCurrency').innerHTML=
    `<div class="curr-pill">⬡ ${gameData.tokens}</div><div class="curr-pill star">${starIconHtml()} ${gameData.skillStars}</div>`;
}
function showScreen(name){
  ['titleScreen','settingsScreen','gameOverScreen','skilltreeScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('hud').classList.add('hidden');
  const gc=document.getElementById('globalCurrency');
  renderGlobalCurrency();
  gc.classList.toggle('dim', name==='game');
  if(name==='title'){
    document.getElementById('titleScreen').classList.remove('hidden');
    document.getElementById('titleMaxWave').textContent=gameData.maxWave;
  } else if(name==='settings'){ document.getElementById('settingsScreen').classList.remove('hidden'); }
  else if(name==='game'){ document.getElementById('hud').classList.remove('hidden'); }
  else if(name==='gameover'){ document.getElementById('gameOverScreen').classList.remove('hidden'); }
  else if(name==='skilltree'){ document.getElementById('skilltreeScreen').classList.remove('hidden'); renderSkillTree(); centerTreeScroll(); }
}
function centerTreeScroll(){
  const wrap=document.getElementById('skillCanvasWrap');
  requestAnimationFrame(()=>{
    wrap.scrollLeft = (TREE_W/2) - wrap.clientWidth/2;
    wrap.scrollTop = (TREE_H/2) - wrap.clientHeight/2;
  });
}

   8. SKILL TREE RENDER
   ========================================================= */
function renderSlotBar(){
  const bar=document.getElementById('slotBar'); bar.innerHTML='';
  gameData.slots.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='slot-btn'+(i===gameData.activeSlot?' active':'');
    btn.textContent=s.name;
    btn.title='ダブルクリックで名称変更';
    btn.addEventListener('click',()=>{ gameData.activeSlot=i; saveGame(); renderSkillTree(); });
    btn.addEventListener('dblclick',()=>{
      const nn=prompt('スロット名を入力', s.name);
      if(nn){ s.name=nn.slice(0,12); saveGame(); renderSlotBar(); }
    });
    bar.appendChild(btn);
  });
}
function renderSkillTree(){
  renderGlobalCurrency(); renderSlotBar();
  const remain=Math.max(0,GATE_THRESHOLD-tokenTotalLevels());
  document.getElementById('gateNote').textContent = remain>0
    ? `基礎強化ツリーを合計あと${remain}Lv取得するとビルドツリー（スキルスター）が解放されます`
    : `ビルドツリー解放済み — 1〜2系統に集中投資するほど倍率が跳ね上がります`;

  const inner=document.getElementById('skillTreeInner');
  Array.from(inner.querySelectorAll('.skill-node,.branch-label')).forEach(n=>n.remove());
  const svg=document.getElementById('skillLines'); svg.innerHTML='';
  const px=(v)=>v/100*TREE_W, py=(v)=>v/100*TREE_H;

  function line(x1,y1,x2,y2,color,w){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',px(x1)); l.setAttribute('y1',py(y1)); l.setAttribute('x2',px(x2)); l.setAttribute('y2',py(y2));
    l.setAttribute('stroke',color); l.setAttribute('stroke-width',w); svg.appendChild(l);
  }
  TOKEN_NODES.forEach(n=>{ line(50,50,n.x,n.y, gameData.tokenLevels[n.id]>0?'rgba(57,255,136,0.6)':'rgba(80,90,120,0.4)', 2); });
  BRANCH_DEFS.forEach(br=>{
    const root=BUILD_NODES.find(n=>n.branch===br.key&&n.tier==='root');
    line(50,50,root.x,root.y, isRevealed(root)?'rgba(255,0,229,0.35)':'rgba(60,60,80,0.3)', 2);
    const labelP=polarUp(br.angle,84);
    const lbl=document.createElement('div');
    lbl.className='branch-label'; lbl.style.left=px(labelP.x)+'px'; lbl.style.top=py(labelP.y)+'px';
    lbl.style.color=br.color; lbl.textContent=br.label;
    inner.appendChild(lbl);
  });
  BUILD_NODES.forEach(n=>{
    if(!n.req) return;
    const reqIds=[n.req.id]; if(n.req.id2) reqIds.push(n.req.id2);
    reqIds.forEach(rid=>{
      const r=findNode(rid);
      const owned = getLevel(n)>0 && getLevel(r)>0;
      line(r.x,r.y,n.x,n.y, owned?'rgba(255,0,229,0.7)':(isRevealed(n)?'rgba(209,196,255,0.4)':'rgba(60,60,80,0.25)'), owned?3:2);
    });
  });

  const core=document.createElement('div');
  core.className='skill-node core'; core.style.left=px(50)+'px'; core.style.top=py(50)+'px';
  core.innerHTML='<div class="icon">◈</div>CORE';
  inner.appendChild(core);

  ALL_NODES.forEach(n=>{
    const lvl=getLevel(n);
    const revealed=isRevealed(n);
    const div=document.createElement('div');
    div.style.left=px(n.x)+'px'; div.style.top=py(n.y)+'px';
    let cls='skill-node';
    if(n.tier==='capstone') cls+=' capstone';
    if(n.tier==='ultimate') cls+=' ultimate';
    if(!revealed){ cls+=' hidden-node'; }
    else if(lvl>0){ cls+= (n.category==='token'?' owned-token':' owned-build'); }
    else if(n.category==='token'){ cls+= canAfford(n)?' token-avail':' locked'; }
    else { cls+= canAfford(n)?' build-avail':' locked'; }
    div.className=cls;

    if(!revealed){
      div.innerHTML=`<div class="icon">？</div>？？？<div style="color:#f4ff00;">${costAt(n,0)}</div>`;
    } else {
      const label = lvl>0 ? `Lv${lvl}/${n.maxLv}` : (lvl>=n.maxLv?'MAX':`${costAt(n,lvl)}`);
      div.innerHTML=`<div class="icon">${n.icon}</div>${n.name}<div style="color:${n.category==='token'?'#f4ff00':'#d1c4ff'};">${label}</div>`;
      div.addEventListener('click', ()=> buyNode(n));
      div.addEventListener('mouseenter',(ev)=>showTooltip(ev,n,lvl,revealed));
      div.addEventListener('mouseleave',hideTooltip);
    }
    inner.appendChild(div);
  });
}
let tooltipEl=null;
function showTooltip(ev,n,lvl,revealed){
  hideTooltip();
  tooltipEl=document.createElement('div'); tooltipEl.className='tooltip';
  const descText = lvl>0? n.desc(lvl) : '未取得';
  const nextCost = lvl<n.maxLv? `次コスト: ${costAt(n,lvl)} ${n.category==='token'?'トークン':'スター'}` : '最大レベル到達';
  tooltipEl.innerHTML=`<b>${n.name}</b><br>${descText}<br>${nextCost}`;
  document.body.appendChild(tooltipEl);
  const r=ev.currentTarget.getBoundingClientRect();
  tooltipEl.style.left=(r.right+8)+'px'; tooltipEl.style.top=(r.top)+'px';
}
function hideTooltip(){ if(tooltipEl){ tooltipEl.remove(); tooltipEl=null; } }

/* drag-to-scroll for tree viewport */
(function(){
  const wrap=document.getElementById('skillCanvasWrap');
  let dragging=false, sx=0, sy=0, sl=0, st=0;
  wrap.addEventListener('mousedown',(e)=>{
    if(e.target.closest('.skill-node')) return;
    dragging=true; sx=e.clientX; sy=e.clientY; sl=wrap.scrollLeft; st=wrap.scrollTop; wrap.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',(e)=>{
    if(!dragging) return;
    wrap.scrollLeft = sl - (e.clientX-sx);
    wrap.scrollTop = st - (e.clientY-sy);
  });
  window.addEventListener('mouseup',()=>{ dragging=false; wrap.style.cursor=''; });
})();

/* =========================================================
   9. UI EVENTS
   ========================================================= */
function ensureAudio(){ AudioEngine.init(); }
document.getElementById('btnStart').addEventListener('click',()=>{ ensureAudio(); AudioEngine.SE.click(); AudioEngine.startBGM(); startRun(); });
document.getElementById('btnSkillTree').addEventListener('click',()=>{ ensureAudio(); AudioEngine.SE.click(); showScreen('skilltree'); });
document.getElementById('btnSettings').addEventListener('click',()=>{ ensureAudio(); AudioEngine.SE.click(); showScreen('settings'); });
document.getElementById('btnSettingsBack').addEventListener('click',()=>{ AudioEngine.SE.click(); showScreen('title'); });
document.getElementById('btnNext').addEventListener('click',()=>{ AudioEngine.SE.click(); AudioEngine.stopBGM(); showScreen('skilltree'); });
document.getElementById('btnTreeExit').addEventListener('click',()=>{ AudioEngine.SE.click(); showScreen('title'); });
document.getElementById('btnRespec').addEventListener('click',()=>{
  const slot=gameData.slots[gameData.activeSlot];
  let starsInvested=0;
  Object.keys(slot.build||{}).forEach(id=>{
    const n=findNode(id); const lvl=slot.build[id];
    for(let l=0;l<lvl;l++) starsInvested+=costAt(n,l);
  });
  if(starsInvested<=0) return;
  const tokenCost=Math.round(starsInvested*5);
  if(gameData.tokens<tokenCost){ alert('トークンが足りません（必要: '+tokenCost+'）'); return; }
  if(!confirm('トークン'+tokenCost+'を消費してスロット「'+slot.name+'」のスキルスターを振り直しますか？')) return;
  gameData.tokens-=tokenCost; gameData.skillStars+=starsInvested; slot.build={};
  AudioEngine.SE.skillBuy(); saveGame(); renderSkillTree();
});
document.getElementById('bgmVol').addEventListener('input',(e)=>{ AudioEngine.setVol(e.target.value/100,audioVolumes.se); gameData.settings.bgm=e.target.value/100; saveGame(); });
document.getElementById('seVol').addEventListener('input',(e)=>{ AudioEngine.setVol(audioVolumes.bgm,e.target.value/100); gameData.settings.se=e.target.value/100; saveGame(); });
document.getElementById('bgmVol').value=Math.round(gameData.settings.bgm*100);
document.getElementById('seVol').value=Math.round(gameData.settings.se*100);

showScreen('title');
})();
</script>
