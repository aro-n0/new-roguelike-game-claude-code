<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON DECAY // Cyber Survivor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div class="global-currency-bar" id="globalCurrency"></div>

  <div id="bossHpWrap" class="hidden">
    <div class="boss-name" id="bossName">BOSS</div>
    <div class="boss-hp-outer"><div class="boss-hp-inner" id="bossHpInner"></div></div>
  </div>

  <div id="titleScreen" class="screen">
    <div class="glitch-title">NEON DECAY</div>
    <div class="sub-title">// CYBER SURVIVOR PROTOCOL //</div>
    <div class="menu-tabs">
      <button class="neon-btn" id="btnStart">ゲーム開始</button>
      <button class="neon-btn magenta" id="btnSkillTree">スキルツリー</button>
      <button class="neon-btn yellow" id="btnSettings">設定</button>
    </div>
    <div style="font-size:11px;color:#7d8cb0;">最高到達WAVE: <span id="titleMaxWave">0</span></div>
  </div>

  <div id="settingsScreen" class="screen hidden">
    <div class="glitch-title" style="font-size:32px;">SETTINGS</div>
    <div class="settings-row">
      <label>BGM音量: <input type="range" id="bgmVol" min="0" max="100" value="35"></label>
      <label>SE音量: <input type="range" id="seVol" min="0" max="100" value="70"></label>
    </div>
    <button class="neon-btn" id="btnSettingsBack">戻る</button>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div>
        <div class="hp-bar-outer"><div class="hp-bar-inner" id="hpBar" style="width:100%"></div></div>
        <div class="hp-text">HP <span id="hpText">100/100</span></div>
      </div>
      <div style="display:flex;">
        <div class="hud-stat">WAVE <span id="waveText" class="c-magenta">1</span></div>
        <div class="hud-stat">KILL <span id="killText" class="c-green">0</span></div>
        <div class="hud-stat">⬡ <span id="runTokenText" class="c-yellow">0</span></div>
        <div class="hud-stat">TIME <span id="timeText">00:00</span></div>
      </div>
    </div>
    <div id="legendButtons"></div>
  </div>
  <div class="wave-banner" id="waveBanner"></div>
  <div class="star-banner" id="starBanner"></div>

  <div id="gameOverScreen" class="screen hidden">
    <div class="stats-panel">
      <h2>&gt;&gt; SYSTEM FAILURE &lt;&lt;</h2>
      <div class="stat-line"><span>到達WAVE</span><span id="statWave">1</span></div>
      <div class="stat-line"><span>撃破数</span><span id="statKills">0</span></div>
      <div class="stat-line"><span>生存時間</span><span id="statTime">00:00</span></div>
      <div class="stat-line"><span>獲得トークン</span><span id="statTokens">0</span></div>
      <div class="stat-line"><span>獲得スキルスター</span><span id="statStars">0</span></div>
    </div>
    <button class="neon-btn magenta" id="btnNext">次へ ▶</button>
  </div>

  <div id="gameClearScreen" class="screen hidden">
    <div class="stats-panel clear-panel">
      <h2 class="clear-h2">&gt;&gt; SYSTEM LIBERATED &lt;&lt;</h2>
      <div style="text-align:center;font-size:13px;color:#c4f5ff;margin-bottom:10px;">WAVE 50 制圧完了 — CYBER CITY 解放</div>
      <div class="stat-line"><span>生存時間</span><span id="clearTime">00:00</span></div>
      <div class="stat-line"><span>総撃破数</span><span id="clearKills">0</span></div>
      <div class="stat-line"><span>獲得トークン</span><span id="clearTokens">0</span></div>
      <div class="stat-line"><span>獲得スキルスター</span><span id="clearStars">0</span></div>
    </div>
    <button class="neon-btn yellow" id="btnClearBack">タイトルへ戻る</button>
  </div>

  <div id="skilltreeOverlay" class="hidden">
    <div class="st-slotbar" id="stSlotBar"></div>
    <div class="st-actions">
      <button class="neon-btn small yellow" id="btnRespec">振り直し</button>
      <button class="neon-btn small" id="btnTreeExit">終了</button>
    </div>
    <div class="st-hint">ホイールでズーム / ドラッグでパン</div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1f0"/>
      <stop offset="50%" stop-color="#d1c4ff"/>
      <stop offset="100%" stop-color="#c4f5ff"/>
    </linearGradient>
  </defs>
</svg>

<script src="audio.js"></script>
<script src="skilltree.js"></script>
<script src="player.js"></script>
<script src="enemy.js"></script>
<script src="main.js"></script>
</body>
</html>
